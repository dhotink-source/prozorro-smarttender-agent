name: Prozorro SmartTender Fuel Agent

on:
  schedule:
    - cron: '7,26,47 * * * *'
  workflow_dispatch:

concurrency:
  group: prozorro-fuel-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Загрузка файлов репозитория
        uses: actions/checkout@v4

      - name: 2. Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Кэш утилиты antiword для чтения .doc
        uses: actions/cache@v4
        with:
          path: ~/.antiword-deb
          key: antiword-deb-${{ runner.os }}-${{ runner.arch }}-v1

      - name: 3. Установка необходимых библиотек
        run: |
          mkdir -p ~/.antiword-deb
          if ! ls ~/.antiword-deb/*.deb >/dev/null 2>&1; then
            (
              cd ~/.antiword-deb
              if ! timeout 25s apt-get download antiword; then
                printf "https://mirrors.edge.kernel.org/ubuntu/\nhttps://mirrors.wikimedia.org/ubuntu/\n" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
                sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 || true
                apt-get download antiword || curl -fsSL --connect-timeout 10 "https://mirrors.edge.kernel.org/ubuntu/pool/universe/a/antiword/antiword_0.37-17_amd64.deb" -o antiword_0.37-17_amd64.deb
              fi
            )
          fi
          sudo dpkg -i ~/.antiword-deb/*.deb
          pip install -r requirements.txt

      - name: 4. Запуск анализа Prozorro и отправки в SmartTender CRM
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_WEB_APP_URL: ${{ secrets.GOOGLE_WEB_APP_URL }}
          SECRET_BRIDGE_KEY: ${{ secrets.SECRET_BRIDGE_KEY }}
        run: python agent.py

      - name: 5. Сохранение базы проверенных тендеров
        run: |
          git config --global user.name "prozorro-smarttender-bot"
          git config --global user.email "bot@noreply.github.com"
          git add processed_tenders.db
          if ! git diff --staged --quiet; then
            git commit -m "Update processed tenders DB"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
